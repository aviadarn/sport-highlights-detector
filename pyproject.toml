[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nba-highlights"
version = "0.1.0"
description = "NBA video highlight detection (audio cues + action recognition) -> JSON report"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "typer>=0.12",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]
# Heavy runtime backends — lazy-imported, only needed for real (non-test) runs.
media = ["scenedetect>=0.6.3", "yt-dlp>=2024.4.9"]
audio = ["librosa>=0.10", "soundfile>=0.12"]
asr = ["faster-whisper>=1.0"]
# transformers pinned <5: v5 refactored VideoMAE attention to standard query/key/value
# biases, but the MCG-NJU/videomae-base-finetuned-kinetics checkpoint stores the original
# q_bias/v_bias scheme; 5.x drops them (random-init biases). 4.x loads it cleanly.
action = ["torch>=2.2", "torchvision>=0.17", "transformers>=4.44,<5", "av>=12.0", "pillow>=10.0"]

[project.scripts]
highlights = "nba_highlights.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/nba_highlights"]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
    "slow: requires real models or network (deselected by default)",
]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 100
target-version = "py311"
